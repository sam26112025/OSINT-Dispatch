<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080f1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer hex ring -->
  <polygon points="100,12 178,56 178,144 100,188 22,144 22,56" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <!-- Inner hex -->
  <polygon points="100,30 162,65 162,135 100,170 38,135 38,65" fill="none" stroke="#0099cc" stroke-width="1" opacity="0.4"/>
  <!-- Glow bg -->
  <circle cx="100" cy="100" r="60" fill="url(#g1)"/>
  <!-- Eye/target reticle -->
  <circle cx="100" cy="100" r="38" fill="none" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)" opacity="0.9"/>
  <circle cx="100" cy="100" r="24" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  <circle cx="100" cy="100" r="6" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <!-- Cross hairs -->
  <line x1="100" y1="58" x2="100" y2="72" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
  <line x1="100" y1="128" x2="100" y2="142" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
  <line x1="58" y1="100" x2="72" y2="100" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
  <line x1="128" y1="100" x2="142" y2="100" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
  <!-- Corner ticks on outer hex -->
  <line x1="100" y1="12" x2="100" y2="22" stroke="#00ff88" stroke-width="2" opacity="0.8"/>
  <line x1="178" y1="56" x2="170" y2="60" stroke="#00ff88" stroke-width="2" opacity="0.8"/>
  <!-- OD text -->
  <text x="100" y="107" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00d4ff" opacity="0.9" letter-spacing="2">IGRS</text>
</svg>