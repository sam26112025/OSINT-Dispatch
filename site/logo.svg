<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .ring-outer { animation: spinCW 10s linear infinite; transform-origin: 100px 100px; }
      .ring-inner { animation: spinCCW 7s linear infinite; transform-origin: 100px 100px; }
      .ring-mid   { animation: spinCW  14s linear infinite; transform-origin: 100px 100px; }
      .pulse1 { animation: pulseFade 2.4s ease-out infinite 0s; transform-origin: 100px 100px; }
      .pulse2 { animation: pulseFade 2.4s ease-out infinite 1.2s; transform-origin: 100px 100px; }
      .core   { animation: coreBeat 1.8s ease-in-out infinite; transform-origin: 100px 100px; }
      .scan   { animation: scanMove 3s linear infinite; }
      .igrs-txt { animation: textGlow 2.2s ease-in-out infinite; }
      .sub-txt  { animation: textGlow 2.2s ease-in-out infinite 1.1s; }
      .tick   { animation: tickBlink 3s ease-in-out infinite; }

      @keyframes spinCW  { to { transform: rotate(360deg); } }
      @keyframes spinCCW { to { transform: rotate(-360deg); } }
      @keyframes pulseFade {
        0%   { transform: scale(0.5); opacity: 0.9; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes coreBeat {
        0%,100% { r: 7px;  opacity: 1.0; }
        50%      { r: 11px; opacity: 0.5; }
      }
      @keyframes scanMove {
        0%   { transform: translateY(0px);   opacity: 0.6; }
        50%  { transform: translateY(130px); opacity: 0.2; }
        100% { transform: translateY(0px);   opacity: 0.6; }
      }
      @keyframes textGlow {
        0%,100% { fill: #00d4ff; filter: drop-shadow(0 0 4px #00d4ff); }
        50%      { fill: #66eeff; filter: drop-shadow(0 0 14px #00d4ff) drop-shadow(0 0 28px #007799); }
      }
      @keyframes tickBlink {
        0%,100% { opacity: 0.8; }
        50%      { opacity: 0.2; }
      }
    </style>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="hexMask">
      <polygon points="100,12 174,54 174,138 100,180 26,138 26,54"/>
    </clipPath>
  </defs>

  <!-- ── BG hex fill ─────────────────────────────────── -->
  <polygon points="100,12 174,54 174,138 100,180 26,138 26,54"
           fill="#040d1a" stroke="#00d4ff" stroke-width="2" opacity="0.97"/>

  <!-- ── Scan line ─────────────────────────────────────── -->
  <rect class="scan" x="26" y="12" width="148" height="2"
        fill="#00d4ff" opacity="0.18" clip-path="url(#hexMask)"/>

  <!-- ── Outer dashed hex ring (rotating CW) ──────────── -->
  <g class="ring-outer" filter="url(#glow)">
    <polygon points="100,20 166,58 166,134 100,172 34,134 34,58"
             fill="none" stroke="#00d4ff" stroke-width="1.4"
             stroke-dasharray="10 5" opacity="0.65"/>
  </g>

  <!-- ── Mid dashed hex ring (rotating CW slow) ───────── -->
  <g class="ring-mid" filter="url(#glow)">
    <polygon points="100,34 154,66 154,126 100,158 46,126 46,66"
             fill="none" stroke="#0099bb" stroke-width="1"
             stroke-dasharray="5 8" opacity="0.4"/>
  </g>

  <!-- ── Inner dashed hex ring (rotating CCW) ─────────── -->
  <g class="ring-inner" filter="url(#glow)">
    <polygon points="100,50 142,74 142,118 100,142 58,118 58,74"
             fill="none" stroke="#00ccee" stroke-width="0.9"
             stroke-dasharray="6 6" opacity="0.5"/>
  </g>

  <!-- ── Pulse rings ────────────────────────────────────── -->
  <circle class="pulse1" cx="100" cy="96" r="36"
          fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.8"/>
  <circle class="pulse2" cx="100" cy="96" r="36"
          fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.8"/>

  <!-- ── Crosshair ──────────────────────────────────────── -->
  <line x1="34"  y1="96" x2="166" y2="96"
        stroke="#00d4ff" stroke-width="0.7" opacity="0.3" clip-path="url(#hexMask)"/>
  <line x1="100" y1="20" x2="100" y2="172"
        stroke="#00d4ff" stroke-width="0.7" opacity="0.3" clip-path="url(#hexMask)"/>

  <!-- ── Corner tick marks ─────────────────────────────── -->
  <g class="tick" stroke="#00d4ff" stroke-width="1.6" opacity="0.75">
    <!-- top-left -->
    <line x1="56" y1="50" x2="66" y2="50"/>
    <line x1="56" y1="50" x2="56" y2="60"/>
    <!-- top-right -->
    <line x1="144" y1="50" x2="134" y2="50"/>
    <line x1="144" y1="50" x2="144" y2="60"/>
    <!-- bottom-left -->
    <line x1="56"  y1="142" x2="66"  y2="142"/>
    <line x1="56"  y1="142" x2="56"  y2="132"/>
    <!-- bottom-right -->
    <line x1="144" y1="142" x2="134" y2="142"/>
    <line x1="144" y1="142" x2="144" y2="132"/>
  </g>

  <!-- ── Centre pulsing dot ────────────────────────────── -->
  <circle class="core" cx="100" cy="96" r="7"
          fill="#00d4ff" filter="url(#softglow)" opacity="0.95"/>

  <!-- ── IGRS text ─────────────────────────────────────── -->
  <text class="igrs-txt"
        x="100" y="84"
        text-anchor="middle"
        font-family="Share Tech Mono, Courier New, monospace"
        font-size="26" font-weight="bold" letter-spacing="4"
        fill="#00d4ff">IGRS</text>

  <!-- ── Sub label ─────────────────────────────────────── -->
  <text class="sub-txt"
        x="100" y="116"
        text-anchor="middle"
        font-family="Share Tech Mono, Courier New, monospace"
        font-size="8.5" letter-spacing="2.5"
        fill="#0099bb" opacity="0.9">INTEL GRID</text>
</svg>