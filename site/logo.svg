<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      .hex-outer { animation: rotateHex 8s linear infinite; transform-origin: 60px 60px; }
      .hex-inner { animation: rotateHexRev 5s linear infinite; transform-origin: 60px 60px; }
      .pulse-ring { animation: pulseRing 2.5s ease-out infinite; transform-origin: 60px 60px; }
      .pulse-ring2 { animation: pulseRing 2.5s ease-out infinite 1.25s; transform-origin: 60px 60px; }
      .core-dot  { animation: corePulse 2s ease-in-out infinite; transform-origin: 60px 60px; }
      .scan-line { animation: scanLine 3s linear infinite; }
      .cross-h   { animation: crossFade 2s ease-in-out infinite; }
      .cross-v   { animation: crossFade 2s ease-in-out infinite 1s; }
      .glow-text { animation: glowText 2s ease-in-out infinite; }

      @keyframes rotateHex {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes rotateHexRev {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
      @keyframes pulseRing {
        0%   { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(1.4); opacity: 0; }
      }
      @keyframes corePulse {
        0%, 100% { r: 5; opacity: 1; }
        50%       { r: 8; opacity: 0.6; }
      }
      @keyframes scanLine {
        0%   { y: 20; opacity: 0.8; }
        50%  { y: 95; opacity: 0.4; }
        100% { y: 20; opacity: 0.8; }
      }
      @keyframes crossFade {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.3; }
      }
      @keyframes glowText {
        0%, 100% { filter: drop-shadow(0 0 4px #00d4ff); }
        50%       { filter: drop-shadow(0 0 12px #00d4ff) drop-shadow(0 0 20px #0099cc); }
      }
    </style>

    <!-- Hex clip -->
    <clipPath id="hexClip">
      <polygon points="60,8 104,32 104,80 60,104 16,80 16,32"/>
    </clipPath>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background dark hex fill -->
  <polygon points="60,8 104,32 104,80 60,104 16,80 16,32"
           fill="#050d18" stroke="#00d4ff" stroke-width="1.5" opacity="0.95"/>

  <!-- Scan line sweep -->
  <rect class="scan-line" x="16" width="88" height="1.5"
        fill="#00d4ff" opacity="0.25" clip-path="url(#hexClip)"/>

  <!-- Pulse rings -->
  <circle class="pulse-ring"  cx="60" cy="56" r="22" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <circle class="pulse-ring2" cx="60" cy="56" r="22" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>

  <!-- Outer rotating hex ring -->
  <g class="hex-outer" filter="url(#glow)">
    <polygon points="60,14 98,34 98,74 60,94 22,74 22,34"
             fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.6"/>
  </g>

  <!-- Inner counter-rotating hex -->
  <g class="hex-inner" filter="url(#glow)">
    <polygon points="60,24 90,40 90,72 60,88 30,72 30,40"
             fill="none" stroke="#00aacc" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.5"/>
  </g>

  <!-- Crosshair lines -->
  <line class="cross-h" x1="22" y1="56" x2="98" y2="56"
        stroke="#00d4ff" stroke-width="0.6" opacity="0.4" clip-path="url(#hexClip)"/>
  <line class="cross-v" x1="60" y1="14" x2="60" y2="98"
        stroke="#00d4ff" stroke-width="0.6" opacity="0.4" clip-path="url(#hexClip)"/>

  <!-- Corner tick marks -->
  <g stroke="#00d4ff" stroke-width="1.2" opacity="0.7">
    <line x1="38" y1="30" x2="44" y2="30"/>
    <line x1="38" y1="30" x2="38" y2="36"/>
    <line x1="82" y1="30" x2="76" y2="30"/>
    <line x1="82" y1="30" x2="82" y2="36"/>
    <line x1="38" y1="82" x2="44" y2="82"/>
    <line x1="38" y1="82" x2="38" y2="76"/>
    <line x1="82" y1="82" x2="76" y2="82"/>
    <line x1="82" y1="82" x2="82" y2="76"/>
  </g>

  <!-- Core pulsing dot -->
  <circle class="core-dot" cx="60" cy="56" r="5"
          fill="#00d4ff" filter="url(#strongGlow)" opacity="0.9"/>

  <!-- IGRS text -->
  <g class="glow-text">
    <text x="60" y="46" text-anchor="middle"
          font-family="Share Tech Mono, monospace" font-size="13" font-weight="bold"
          fill="#00d4ff" letter-spacing="2">IGRS</text>
    <text x="60" y="74" text-anchor="middle"
          font-family="Share Tech Mono, monospace" font-size="5.5"
          fill="#00aacc" letter-spacing="1.5" opacity="0.85">INTEL GRID</text>
  </g>
</svg>