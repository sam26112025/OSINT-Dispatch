<!-- Ocean animation -->
<script>
(function(){
  const canvas=document.getElementById('ocean-canvas');
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);

  const LANES=[
    {sx:0,sy:.3,ex:1,ey:.25,c:'#00c8ff'},
    {sx:0,sy:.55,ex:1,ey:.45,c:'#0099cc'},
    {sx:.1,sy:1,ex:.9,ey:0,c:'#005580'},
    {sx:0,sy:.7,ex:1,ey:.8,c:'#00c8ff'},
    {sx:.2,sy:0,ex:.8,ey:1,c:'#003355'},
  ];
  const VESSELS=LANES.map((l,i)=>({lane:i,t:Math.random(),speed:.0003+Math.random()*.0004}));
  const PORTS=[
    {x:.12,y:.28},{x:.88,y:.22},{x:.5,y:.5},{x:.25,y:.72},{x:.75,y:.78},{x:.45,y:.1},{x:.6,y:.9}
  ];

  function bezier(sx,sy,ex,ey,t){
    const cx=(sx+ex)/2+(ey-sy)*.3, cy=(sy+ey)/2+(ex-sx)*.1;
    const it=1-t;
    return{x:(it*it*sx+2*it*t*cx+t*t*ex)*canvas.width,y:(it*it*sy+2*it*t*cy+t*t*ey)*canvas.height};
  }

  let dash=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    dash=(dash+.3)%40;

    // Lanes
    LANES.forEach(l=>{
      ctx.save();
      ctx.setLineDash([6,14]);
      ctx.lineDashOffset=-dash;
      ctx.strokeStyle=l.c;
      ctx.globalAlpha=.18;
      ctx.lineWidth=1;
      ctx.beginPath();
      const cx=(l.sx+l.ex)/2*canvas.width+(l.ey-l.sy)*canvas.width*.3;
      const cy=(l.sy+l.ey)/2*canvas.height+(l.ex-l.sx)*canvas.height*.1;
      ctx.moveTo(l.sx*canvas.width,l.sy*canvas.height);
      ctx.quadraticCurveTo(cx,cy,l.ex*canvas.width,l.ey*canvas.height);
      ctx.stroke();
      ctx.restore();
    });

    // Port nodes
    PORTS.forEach(p=>{
      ctx.save();
      ctx.globalAlpha=.5;
      ctx.beginPath();
      ctx.arc(p.x*canvas.width,p.y*canvas.height,4,0,Math.PI*2);
      ctx.fillStyle='#00c8ff';
      ctx.fill();
      ctx.globalAlpha=.12;
      ctx.beginPath();
      ctx.arc(p.x*canvas.width,p.y*canvas.height,12,0,Math.PI*2);
      ctx.fillStyle='#00c8ff';
      ctx.fill();
      ctx.restore();
    });

    // Vessel dots
    VESSELS.forEach(v=>{
      v.t=(v.t+v.speed)%1;
      const l=LANES[v.lane];
      const pos=bezier(l.sx,l.sy,l.ex,l.ey,v.t);
      ctx.save();
      ctx.globalAlpha=.85;
      ctx.beginPath();
      ctx.arc(pos.x,pos.y,3,0,Math.PI*2);
      ctx.fillStyle='#00f0ff';
      ctx.shadowColor='#00c8ff';
      ctx.shadowBlur=8;
      ctx.fill();
      ctx.restore();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

function CountUp({target,suffix=''}){
  const [val,setVal]=useState(0);
  const ref=useRef(null);
  useEffect(()=>{
    const io=new IntersectionObserver(([e])=>{
      if(e.isIntersecting){
        let start=0; const step=target/60;
        const t=setInterval(()=>{
          start=Math.min(start+step,target);
          setVal(Math.floor(start));
          if(start>=target){clearInterval(t);}
        },25);
      }
    },{threshold:.3});
    if(ref.current)io.observe(ref.current);
    return()=>io.disconnect();
  },[target]);
  return <span ref={ref}>{val.toLocaleString()}{suffix}</span>;
}

function TierBadge({tier}){

}
