<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Redirecting — IGRS</title>
<meta name="robots" content="noindex">
<script src="links.js"></script>
<style>
body{background:#04090f;color:#00d4ff;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;}
.spinner{width:40px;height:40px;border:3px solid rgba(0,212,255,.2);border-top-color:#00d4ff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
a{color:#00d4ff;}.box{text-align:center;}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div id="msg">Redirecting...</div>
</div>
<script>
(function(){
  var ALLOW=["igrs.xyz","www.igrs.xyz","check.igrs.xyz"];
  function isHttp(u){return /^https?:\/\//i.test(u);}
  function hostOf(u){try{return new URL(u).hostname.toLowerCase();}catch(e){return null;}}
  function setMsg(html,hide){document.getElementById("msg").innerHTML=html;if(hide){var sp=document.querySelector(".spinner");if(sp)sp.style.display="none";}}
  function trusted(h){return !!h&&ALLOW.some(function(d){return h===d||h.endsWith("."+d);});}
  function leaving(dest){
    var sp=document.querySelector(".spinner");if(sp)sp.style.display="none";
    var box=document.getElementById("msg");box.innerHTML="";
    var t=document.createElement("div");t.style.marginBottom="14px";t.textContent="\u26A0 You are leaving IGRS";
    var sub=document.createElement("div");sub.style.cssText="font-size:12px;opacity:.75;margin-bottom:18px;word-break:break-all;";sub.textContent=dest;
    var go=document.createElement("a");go.href=dest;go.rel="noopener noreferrer";go.textContent="Continue to destination \u2192";go.style.marginRight="18px";
    var back=document.createElement("a");back.href="https://igrs.xyz";back.textContent="Back to IGRS";
    box.appendChild(t);box.appendChild(sub);box.appendChild(go);box.appendChild(back);
  }
  var params=new URLSearchParams(window.location.search);
  var encUrl=params.get("u");
  if(encUrl){
    var dest=decodeURIComponent(encUrl);
    if(!isHttp(dest)) dest="https://"+dest;
    if(!isHttp(dest)){setMsg("Unsupported link.<br><br><a href='https://igrs.xyz'>IGRS Home &rarr;</a>",true);return;}
    var h=hostOf(dest);
    if(trusted(h)){window.location.replace(dest);return;}   // trusted -> silent
    leaving(dest);return;                                    // external -> manual confirm (no open redirect)
  }
  var qs=window.location.search.replace("?","").split("&")[0].split("=")[0];
  var hash=window.location.hash.replace("#","");
  var path=window.location.pathname.split("/go/")[1];
  if(path) path=path.replace(/\/$/,"").replace(".html","");
  var slug=(path&&path!=="index"&&path!=="")?path:(qs||hash);
  slug=decodeURIComponent(slug).toLowerCase().trim();
  if(slug&&IGRS_LINKS[slug]){
    window.location.replace(IGRS_LINKS[slug]);               // map values are trusted
  } else if(slug){
    setMsg("Link not found.<br><br><a href='https://igrs.xyz'>IGRS Home &rarr;</a>",true);
  } else {
    window.location.replace("https://igrs.xyz/links.html");
  }
})();
</script>
</body>
</html>
