<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Redirecting — IGRS</title>
<meta name="robots" content="noindex">
<script src="links.js"></script>
<style>
body{background:#04090f;color:#00d4ff;font-family:'IBM Plex Mono',monospace,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid rgba(0,212,255,.2);border-top-color:#00d4ff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
a{color:#00d4ff;}
.box{text-align:center;}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" style="margin:0 auto 16px;"></div>
  <div id="msg">Redirecting...</div>
</div>
<script>
(function(){
  // Support both ?slug and #slug and /go/slug formats
  var slug = "";
  var qs = window.location.search.replace("?","").split("&")[0];
  var hash = window.location.hash.replace("#","");
  // Path-based: /go/slug
  var path = window.location.pathname.split("/go/")[1];
  if(path) path = path.replace(/\/$/,"").replace(".html","");

  slug = (path && path !== "index" && path !== "") ? path : (qs || hash);
  slug = decodeURIComponent(slug).toLowerCase().trim();

  if(slug && IGRS_LINKS[slug]){
    document.getElementById("msg").innerHTML = "Taking you there...";
    window.location.replace(IGRS_LINKS[slug]);
  } else if(slug){
    document.getElementById("msg").innerHTML = "Link not found.<br><br><a href='https://igrs.xyz'>Go to IGRS Home &rarr;</a>";
    document.querySelector(".spinner").style.display="none";
  } else {
    // No slug — redirect to the public shortener tool
    window.location.replace("https://igrs.xyz/links.html");
  }
})();
</script>
</body>
</html>
