name: Deploy to GoDaddy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # IndexNow ko changed-files diff ke liye chahiye

      - name: Validate site + regenerate sitemap
        run: |
          python3 scripts/validate.py
          python3 scripts/gen_sitemap.py --write

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set dns:order inet;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} p3plzcpnl506320.prod.phx3.secureserver.net;
          mirror --reverse --delete --verbose ./site/ public_html/;
          bye
          "

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Ping IndexNow (changed pages)
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'site/**/*.html'); do
            curl -s "https://api.indexnow.org/indexnow?url=https://igrs.xyz/${f#site/}&key=730d77e63bce1e2d1ccc0eb43fcce464" || true
          done
