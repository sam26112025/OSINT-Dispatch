- name: Fetch threat intelligence data
        run: |
          mkdir -p site/data

          # URLhaus — CSV download (no auth needed)
          echo "Fetching URLhaus CSV..."
          curl --max-time 30 -o /tmp/urlhaus.csv \
            "https://urlhaus.abuse.ch/downloads/csv_recent/" 2>/dev/null || true
          # Convert CSV to JSON
          python3 -c "
          import csv, json, sys
          urls = []
          try:
            with open('/tmp/urlhaus.csv','r',errors='ignore') as f:
              for line in f:
                if line.startswith('#') or not line.strip(): continue
                parts = line.strip().split(',')
                if len(parts) >= 5:
                  urls.append({'id':parts[0].strip('\"'),'date_added':parts[1].strip('\"'),
                    'url':parts[2].strip('\"'),'url_status':parts[3].strip('\"'),
                    'host':parts[2].strip('\"').split('/')[2] if '//' in parts[2] else '',
                    'tags':[]})
          except: pass
          print(json.dumps({'query_status':'ok','urls':urls}))
          " > site/data/urlhaus.json
          echo "URLhaus: $(python3 -c \"import json;d=json.load(open('site/data/urlhaus.json'));print(len(d.get('urls',[])))\" 2>/dev/null || echo 0) URLs"

          # Feodo — save regardless of HTTP code
          echo "Fetching Feodo..."
          curl --max-time 20 -o /tmp/feodo_raw.json \
            "https://feodotracker.abuse.ch/downloads/ipblocklist_aggressive.json" 2>/dev/null || true
          python3 -c "
          import json, sys
          try:
            data = json.load(open('/tmp/feodo_raw.json'))
            print(json.dumps(data))
          except:
            print('[]')
          " > site/data/feodo.json
          echo "Feodo: $(python3 -c \"import json;d=json.load(open('site/data/feodo.json'));print(len(d) if isinstance(d,list) else 0)\" 2>/dev/null || echo 0) records"

          # MalwareBazaar — use public JSON export
          echo "Fetching MalwareBazaar..."
          curl --max-time 30 -o /tmp/mb_raw.json \
            "https://bazaar.abuse.ch/export/json/recent/" 2>/dev/null || true
          python3 -c "
          import json, sys
          try:
            data = json.load(open('/tmp/mb_raw.json'))
            if isinstance(data, list):
              print(json.dumps({'query_status':'ok','data':data}))
            else:
              print(json.dumps(data))
          except:
            print(json.dumps({'query_status':'no_results','data':[]}))
          " > site/data/malwarebazaar.json
          echo "MalwareBazaar: $(python3 -c \"import json;d=json.load(open('site/data/malwarebazaar.json'));print(len(d.get('data',[])))\" 2>/dev/null || echo 0) samples"

          # CISA KEV — already works!
          echo "Fetching CISA KEV..."
          curl --max-time 30 -o site/data/cisa_kev.json \
            "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json" 2>/dev/null \
            || echo '{"vulnerabilities":[]}' > site/data/cisa_kev.json
          echo "CISA KEV: $(python3 -c \"import json;d=json.load(open('site/data/cisa_kev.json'));print(len(d.get('vulnerabilities',[])))\" 2>/dev/null || echo 0) entries"

          # NVD CVEs — already works!
          echo "Fetching NVD CVEs..."
          START=$(date -u -d "30 days ago" "+%Y-%m-%dT%H:%M:%S.000")
          END=$(date -u "+%Y-%m-%dT%H:%M:%S.000")
          curl --max-time 60 -o site/data/nvd_cves.json \
            "https://services.nvd.nist.gov/rest/json/cves/2.0?pubStartDate=${START}&pubEndDate=${END}&resultsPerPage=100" 2>/dev/null \
            || echo '{"vulnerabilities":[]}' > site/data/nvd_cves.json
          echo "NVD: $(python3 -c \"import json;d=json.load(open('site/data/nvd_cves.json'));print(len(d.get('vulnerabilities',[])))\" 2>/dev/null || echo 0) CVEs"

          echo '{"updated":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > site/data/last_updated.json
          echo "=== Done ==="
          ls -lh site/data/
