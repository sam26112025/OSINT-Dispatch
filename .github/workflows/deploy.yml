name: Deploy to GoDaddy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch threat intelligence data
        run: |
          mkdir -p site/data
          curl -sf -X POST "https://urlhaus-api.abuse.ch/v1/urls/recent/limit/50/" -H "Content-Type: application/x-www-form-urlencoded" --max-time 20 -o site/data/urlhaus.json || echo '{"urls":[]}' > site/data/urlhaus.json
          curl -sf "https://feodotracker.abuse.ch/downloads/ipblocklist_aggressive.json" --max-time 20 -o site/data/feodo.json || echo '[]' > site/data/feodo.json
          curl -sf -X POST "https://mb-api.abuse.ch/api/v1/" -H "Content-Type: application/x-www-form-urlencoded" -d "query=get_recent&selector=time" --max-time 20 -o site/data/malwarebazaar.json || echo '{"data":[]}' > site/data/malwarebazaar.json
          curl -sf "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json" --max-time 30 -o site/data/cisa_kev.json || echo '{"vulnerabilities":[]}' > site/data/cisa_kev.json
          START=$(date -u -d "30 days ago" "+%Y-%m-%dT%H:%M:%S.000")
          END=$(date -u "+%Y-%m-%dT%H:%M:%S.000")
          curl -sf "https://services.nvd.nist.gov/rest/json/cves/2.0?pubStartDate=${START}&pubEndDate=${END}&resultsPerPage=100" --max-time 45 -o site/data/nvd_cves.json || echo '{"vulnerabilities":[]}' > site/data/nvd_cves.json
          echo '{"updated":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > site/data/last_updated.json

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set dns:order inet;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} p3plzcpnl506320.prod.phx3.secureserver.net;
          mirror --reverse --delete --verbose ./site/ public_html/;
          bye
          "
